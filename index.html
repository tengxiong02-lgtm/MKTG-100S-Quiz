<!DOCTYPE html>
<html>
<head>
  <title>MKTG 100S Quiz</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 30px;
    }

    .quiz-box {
      background: white;
      max-width: 800px;
      margin: auto;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
    }

    h1, h2, h3 {
      text-align: center;
    }

    .meta {
      color: #555;
      font-size: 14px;
      margin-bottom: 10px;
      text-align: center;
    }

    .chapter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
    }

    .answer {
      display: block;
      margin: 12px 0;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      cursor: pointer;
    }

    .answer:hover {
      background: #eee;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
    }

    .chapter-btn {
      background: #444;
      margin-top: 0;
    }

    #result {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="quiz-box">

    <h1>MKTG 100S Quiz</h1>

    <h3 style="margin-top:-10px; color:#666; font-weight:normal;">
      Spring 2026
    </h3>

    <p class="meta">
      Final: May 11th • 8:00 PM
    </p>

    <p class="meta">
      By Teng Xiong
    </p>

    <p class="meta">
      Contact: tengxiong02@mail.fresnostate.edu
    </p>

    <p class="meta">
      Phone: 559.365.5049
    </p>

    <div id="chapterSelect">

      <h2>Choose a Chapter</h2>

      <div class="chapter-grid">

        <button class="chapter-btn" onclick="startChapter('Chapter 1')">
          Chapter 1
        </button>

        <button class="chapter-btn" onclick="startChapter('Chapter 2')">
          Chapter 2
        </button>

        <button class="chapter-btn" onclick="startChapter('Chapter 4')">
          Chapter 4
        </button>

        <button class="chapter-btn" onclick="startChapter('Chapter 5')">
          Chapter 5
        </button>

        <button class="chapter-btn" onclick="startChapter('Chapter 6')">
          Chapter 6
        </button>

        <button class="chapter-btn" onclick="startChapter('Chapter 7')">
          Chapter 7
        </button>

        <button class="chapter-btn" onclick="startChapter('Chapter 8')">
          Chapter 8
        </button>

        <button class="chapter-btn" onclick="startChapter('Chapter 9')">
          Chapter 9
        </button>

        <button class="chapter-btn" onclick="startChapter('Chapter 15')">
          Chapter 15
        </button>

        <button class="chapter-btn" onclick="startChapter('Chapter 17')">
          Chapter 17
        </button>

        <button class="chapter-btn" onclick="startChapter('Chapter 19')">
          Chapter 19
        </button>

        <button class="chapter-btn" onclick="startChapter('1st Exam')">
          1st Exam
        </button>

        <button class="chapter-btn" onclick="startChapter('Final Exam')">
          Final Exam
        </button>

        <button class="chapter-btn" onclick="startAllChapters()">
          All Chapters
        </button>

      </div>
    </div>

    <div id="quizArea" style="display:none;">

      <p id="progress" class="meta"></p>

      <p id="category" class="meta"></p>

      <h2 id="question"></h2>

      <div id="answers"></div>

      <button id="nextBtn" onclick="nextQuestion()">
        Next
      </button>

    </div>

    <div id="result"></div>

  </div>

  <script src="questions.js"></script>

  <script>

    let currentQuiz = [];
    let originalQuiz = [];

    let currentQuestion = 0;
    let score = 0;
    let selectedAnswer = null;
    let missedQuestions = [];

    function startChapter(chapterName) {

      currentQuiz = questions.filter(
        q => q.chapter === chapterName
      );

      originalQuiz = [...currentQuiz];

      if (currentQuiz.length === 0) {

        alert(
          "No questions found for " +
          chapterName +
          ". Check your questions.js chapter names."
        );

        return;
      }

      startQuiz();
    }

    function startAllChapters() {

      currentQuiz = [...questions];
      originalQuiz = [...questions];

      startQuiz();
    }

    function startQuiz() {

      currentQuestion = 0;
      score = 0;
      selectedAnswer = null;
      missedQuestions = [];

      document.getElementById("chapterSelect").style.display = "none";

      document.getElementById("quizArea").style.display = "block";

      document.getElementById("result").innerHTML = "";

      loadQuestion();
    }

    function loadQuestion() {

      selectedAnswer = null;

      const current = currentQuiz[currentQuestion];

      document.getElementById("progress").innerText =
        "Question " + (currentQuestion + 1) +
        " of " + currentQuiz.length;

      document.getElementById("category").innerText =
        current.chapter + " | " + current.category;

      document.getElementById("question").innerText =
        current.question;

      const answersDiv =
        document.getElementById("answers");

      answersDiv.innerHTML = "";

      current.answers.forEach((answer, index) => {

        const label = document.createElement("label");

        label.className = "answer";

        label.innerHTML = `
          <input type="radio" name="answer" value="${index}">
          ${answer}
        `;

        label.onclick = function() {
          selectedAnswer = index;
        };

        answersDiv.appendChild(label);

      });

    }

    function nextQuestion() {

      if (selectedAnswer === null) {

        alert("Please select an answer.");

        return;
      }

      const current = currentQuiz[currentQuestion];

      if (selectedAnswer === current.correct) {

        score++;

      } else {

        missedQuestions.push(current);

      }

      currentQuestion++;

      if (currentQuestion < currentQuiz.length) {

        loadQuestion();

      } else {

        showResult();

      }

    }

    function showResult() {

      document.getElementById("quizArea").style.display =
        "none";

      let resultHTML = `
        <h2>
          You scored ${score} out of ${currentQuiz.length}
        </h2>
      `;

      if (missedQuestions.length > 0) {

        resultHTML += `
          <button onclick="retakeMissed()">
            Retake Missed Questions (${missedQuestions.length})
          </button>
        `;

      } else {

        resultHTML += `
          <h3>Perfect Score!</h3>
        `;

      }

      resultHTML += `

        <button onclick="restartSameQuiz()">
          Restart This Quiz
        </button>

        <button onclick="backToChapters()">
          Choose Another Chapter
        </button>

      `;

      document.getElementById("result").innerHTML =
        resultHTML;

    }

    function retakeMissed() {

      currentQuiz = [...missedQuestions];

      currentQuestion = 0;
      score = 0;
      selectedAnswer = null;
      missedQuestions = [];

      document.getElementById("quizArea").style.display =
        "block";

      document.getElementById("result").innerHTML = "";

      loadQuestion();

    }

    function restartSameQuiz() {

      currentQuiz = [...originalQuiz];

      currentQuestion = 0;
      score = 0;
      selectedAnswer = null;
      missedQuestions = [];

      document.getElementById("quizArea").style.display =
        "block";

      document.getElementById("result").innerHTML = "";

      loadQuestion();

    }

    function backToChapters() {

      currentQuiz = [];
      originalQuiz = [];

      currentQuestion = 0;
      score = 0;
      selectedAnswer = null;
      missedQuestions = [];

      document.getElementById("chapterSelect").style.display =
        "block";

      document.getElementById("quizArea").style.display =
        "none";

      document.getElementById("result").innerHTML = "";

    }

  </script>

</body>
</html>
