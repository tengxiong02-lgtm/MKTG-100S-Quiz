<!DOCTYPE html>
<html>
<head>
  <title>MKTG 100S Quiz</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 30px;
    }

    .quiz-box {
      background: white;
      max-width: 600px;
      margin: auto;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
    }

    .answer {
      display: block;
      margin: 12px 0;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      cursor: pointer;
    }

    .answer:hover {
      background: #eee;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
    }

    #result {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="quiz-box">
    <h1>MKTG 100S Quiz</h1>

    <p id="progress"></p>
    <h2 id="question"></h2>

    <div id="answers"></div>

    <button onclick="nextQuestion()">Next</button>

    <p id="result"></p>
  </div>

  <script>
    const questions = [
      {
        question: "What is marketing?",
        answers: [
          "Selling only",
          "Creating, communicating, and delivering value",
          "Making ads"
        ],
        correct: 1
      },
      {
        question: "What are the 4 Ps?",
        answers: [
          "Product, Price, Place, Promotion",
          "People, Profit, Plan, Power",
          "Product, Profit, Place, People"
        ],
        correct: 0
      },
      {
        question: "What does the BCG Matrix help with?",
        answers: [
          "Hiring employees",
          "Choosing where to invest resources",
          "Designing logos"
        ],
        correct: 1
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let selectedAnswer = null;

    function loadQuestion() {
      selectedAnswer = null;

      document.getElementById("progress").innerText =
        "Question " + (currentQuestion + 1) + " of " + questions.length;

      document.getElementById("question").innerText =
        questions[currentQuestion].question;

      const answersDiv = document.getElementById("answers");
      answersDiv.innerHTML = "";

      questions[currentQuestion].answers.forEach((answer, index) => {
        const label = document.createElement("label");
        label.className = "answer";

        label.innerHTML = `
          <input type="radio" name="answer" value="${index}">
          ${answer}
        `;

        label.onclick = function() {
          selectedAnswer = index;
        };

        answersDiv.appendChild(label);
      });
    }

    function nextQuestion() {
      if (selectedAnswer === null) {
        alert("Please select an answer.");
        return;
      }

      if (selectedAnswer === questions[currentQuestion].correct) {
        score++;
      }

      currentQuestion++;

      if (currentQuestion < questions.length) {
        loadQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById("progress").style.display = "none";
      document.getElementById("question").style.display = "none";
      document.getElementById("answers").style.display = "none";
      document.querySelector("button").style.display = "none";

      document.getElementById("result").innerText =
        "You scored " + score + " out of " + questions.length + ".";
    }

    loadQuestion();
  </script>

</body>
</html>
