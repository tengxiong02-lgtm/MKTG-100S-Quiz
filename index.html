<!DOCTYPE html>
<html>
<head>
  <title>MKTG 100S Quiz</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 30px;
    }

    .quiz-box {
      background: white;
      max-width: 700px;
      margin: auto;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
    }

    .meta {
      color: #555;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .answer {
      display: block;
      margin: 12px 0;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      cursor: pointer;
    }

    .answer:hover {
      background: #eee;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
    }

    #result {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="quiz-box">
    <h1>MKTG 100S Quiz</h1>

    <p id="progress" class="meta"></p>
    <p id="category" class="meta"></p>

    <h2 id="question"></h2>

    <div id="answers"></div>

    <button id="nextBtn" onclick="nextQuestion()">Next</button>

    <div id="result"></div>
  </div>

  <script src="questions.js"></script>

  <script>
    let currentQuiz = [...questions];

    let currentQuestion = 0;
    let score = 0;
    let selectedAnswer = null;
    let missedQuestions = [];

    function loadQuestion() {
      selectedAnswer = null;

      const current = currentQuiz[currentQuestion];

      document.getElementById("progress").innerText =
        "Question " + (currentQuestion + 1) + " of " + currentQuiz.length;

      document.getElementById("category").innerText =
        "Category: " + current.category;

      document.getElementById("question").innerText =
        current.question;

      const answersDiv = document.getElementById("answers");
      answersDiv.innerHTML = "";

      current.answers.forEach((answer, index) => {
        const label = document.createElement("label");
        label.className = "answer";

        label.innerHTML = `
          <input type="radio" name="answer" value="${index}">
          ${answer}
        `;

        label.onclick = function() {
          selectedAnswer = index;
        };

        answersDiv.appendChild(label);
      });
    }

    function nextQuestion() {
      if (selectedAnswer === null) {
        alert("Please select an answer.");
        return;
      }

      const current = currentQuiz[currentQuestion];

      if (selectedAnswer === current.correct) {
        score++;
      } else {
        missedQuestions.push(current);
      }

      currentQuestion++;

      if (currentQuestion < currentQuiz.length) {
        loadQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById("progress").style.display = "none";
      document.getElementById("category").style.display = "none";
      document.getElementById("question").style.display = "none";
      document.getElementById("answers").style.display = "none";
      document.getElementById("nextBtn").style.display = "none";

      let resultHTML = `
        <h2>You scored ${score} out of ${currentQuiz.length}</h2>
      `;

      if (missedQuestions.length > 0) {
        resultHTML += `
          <button onclick="retakeMissed()">
            Retake Missed Questions (${missedQuestions.length})
          </button>
        `;
      } else {
        resultHTML += `
          <h3>Perfect Score!</h3>
        `;
      }

      resultHTML += `
        <button onclick="restartQuiz()">
          Restart Full Quiz
        </button>
      `;

      document.getElementById("result").innerHTML = resultHTML;
    }

    function retakeMissed() {
      currentQuiz = [...missedQuestions];

      currentQuestion = 0;
      score = 0;
      selectedAnswer = null;
      missedQuestions = [];

      resetQuizUI();
      loadQuestion();
    }

    function restartQuiz() {
      currentQuiz = [...questions];

      currentQuestion = 0;
      score = 0;
      selectedAnswer = null;
      missedQuestions = [];

      resetQuizUI();
      loadQuestion();
    }

    function resetQuizUI() {
      document.getElementById("progress").style.display = "block";
      document.getElementById("category").style.display = "block";
      document.getElementById("question").style.display = "block";
      document.getElementById("answers").style.display = "block";
      document.getElementById("nextBtn").style.display = "block";

      document.getElementById("result").innerHTML = "";
    }

    loadQuestion();
  </script>

</body>
</html>
